name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No token, and that is the point.
  #
  # Sibling Kairos crates used to be consumed by git URL from PRIVATE repos, so
  # every job needed a PAT to fetch them. They are crates.io versions now --
  # `cargo publish` refuses a git dependency -- so there is nothing private to
  # fetch and nothing to authorise. The mission plan's §2.11 bar asks for "CI
  # green without a token"; this is what makes that true rather than aspirational.

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # The permissive-only, no-C posture deny.toml states, checked on every
      # push rather than by hand.
      - run: cargo deny check

  no_std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf           # Cortex-M4F / M7 class
          - thumbv8m.main-none-eabihf       # Cortex-M33 / M55 / M85 class
          - riscv32imac-unknown-none-elf    # ESP32-C6 / C61 / H2 class, QEMU virt
          - riscv32imafc-unknown-none-elf   # ESP32-P4 class
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p rusty_rtos_kernel-core --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p rusty_rtos_kernel-core --no-default-features --features alloc --target ${{ matrix.target }}
