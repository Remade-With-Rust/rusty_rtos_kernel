name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sibling Kairos repos are consumed by git URL and are PRIVATE until each is
  # market-ready. Cargo fetches them through the git CLI, which honours the
  # token rewrite below. Set the repository secret KAIROS_GIT_TOKEN to a
  # fine-grained PAT (or GitHub App token) with read access to the siblings;
  # `kairos secrets` fans it out. Without it every job that fetches a private
  # sibling is red — a conditional auth step that silently skips is a red CI
  # that looks like flakiness, so the step names itself in the log.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  KAIROS_GIT_TOKEN: ${{ secrets.KAIROS_GIT_TOKEN }}

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.KAIROS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${KAIROS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.KAIROS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${KAIROS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # The permissive-only, no-C posture deny.toml states, checked on every
      # push rather than by hand.
      - run: cargo deny check

  no_std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf           # Cortex-M4F / M7 class
          - thumbv8m.main-none-eabihf       # Cortex-M33 / M55 / M85 class
          - riscv32imac-unknown-none-elf    # ESP32-C6 / C61 / H2 class, QEMU virt
          - riscv32imafc-unknown-none-elf   # ESP32-P4 class
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.KAIROS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${KAIROS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p rusty_rtos_kernel-core --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p rusty_rtos_kernel-core --no-default-features --features alloc --target ${{ matrix.target }}
