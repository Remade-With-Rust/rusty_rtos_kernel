[package]
name = "xiao-s3-realtime"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Every Kairos kernel feature at once on a XIAO ESP32-S3, with real-time latency, jitter and deadline measurements on the 1-cycle ccount."

[features]
# The interrupt-path fixes are the DEFAULT: the in-trap switch, no FP
# save/restore, and the hot code in IRAM. Each has an opt-out below, named for
# the behaviour it restores, so every comparison stays one flag away.
default = []
# Run for ten minutes instead of twenty seconds: the worst case only means
# something over a long run.
long = []
# The negative control: the mutex becomes a binary semaphore, which has no
# priority inheritance, so the two inheritance checks must FAIL.
no-inherit = []
# Cut the interrupt -> task latency into ten stamped segments, and measure one
# bare esp-hal interrupt's entry and exit; see src/decompose.rs.
decompose = []
# Opt-out of fix 1: switch by raising `Software0` and taking a second trap,
# instead of inside the waking interrupt's own trap.
software0-switch = []
# Opt-out of fix 2: esp-hal's `float-save-restore`, 18 FP words saved and
# restored on every trap and copied on every switch. WITHOUT it (the default)
# xtensa-lx-rt traps with CPENABLE = 0 and every task starts with the FPU
# disabled (the port zero-fills a new context), so a float in a task faults
# loudly instead of corrupting another task's FP registers. A firmware whose
# tasks use floats needs this feature.
fp-save = ["esp-hal/float-save-restore"]
# Opt-out of fix 4: leave the code in flash behind the instruction cache,
# instead of IRAM (`kairos_iram.x`, chosen by `build.rs`).
flash-code = []

[dependencies]
rusty_rtos_kernel-core = { path = "../../crates/rusty_rtos_kernel-core", default-features = false }
rusty_rtos_core = { path = "../../../rusty_rtos_core/crates/rusty_rtos_core", default-features = false }
rusty_rtos_port-xtensa = { path = "../../../rusty_rtos_port/crates/rusty_rtos_port-xtensa", default-features = false }
xtensa-lx = "0.12"
esp-hal = { version = "=1.2.1", default-features = false, features = ["esp32s3", "unstable", "rt", "exception-handler"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-println = { version = "=0.18.0", default-features = false, features = [
    "esp32s3",
    "jtag-serial",
] }
esp-backtrace = { version = "=0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
critical-section = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace]
